<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>design-system</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ph" style="background:#1a1a24;padding:14px">
  <div class="ttl ol" style="font-size:19px;margin-bottom:10px">《疯狂鸽王》UI 设计系统 v2 · 土豆兄弟风</div>
  <div class="sub" style="margin-bottom:8px">深灰底 + 3px 纯黑描边 + 硬投影 + 高饱和色块 + 描边粗体字</div>

  <div style="font-size:12px;color:#FFD166;font-weight:bold;margin:10px 0 5px">色板</div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <div style="text-align:center"><div style="width:46px;height:34px;background:#262636;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">底#262636</div></div>
    <div style="text-align:center"><div style="width:46px;height:34px;background:#1b1b24;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">面板#1b1b24</div></div>
    <div style="text-align:center"><div style="width:46px;height:34px;background:#33333f;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">次按钮</div></div>
    <div style="text-align:center"><div style="width:46px;height:34px;background:#f5a623;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">主强调</div></div>
    <div style="text-align:center"><div style="width:46px;height:34px;background:#8bd63a;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">正向</div></div>
    <div style="text-align:center"><div style="width:46px;height:34px;background:#e8452f;border:3px solid #000;border-radius:6px"></div><div class="sub" style="font-size:9px">危险</div></div>
  </div>

  <div style="font-size:12px;color:#FFD166;font-weight:bold;margin:14px 0 5px">字体（全部加粗 + 黑描边）</div>
  <div class="ttl ol" style="font-size:26px">大字 26 标题 / 结算</div>
  <div class="ol" style="font-size:17px;font-weight:bold;margin-top:4px">中字 17 按钮 / 卡片标题</div>
  <div class="ol" style="font-size:13px;font-weight:bold;margin-top:4px">小字 13 正文 / 属性</div>
  <div class="sub" style="margin-top:4px">说明文字 12（不加描边，降低噪音）</div>

  <div style="font-size:12px;color:#FFD166;font-weight:bold;margin:14px 0 5px">按钮</div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="btn pri" style="width:110px;padding:11px 0;font-size:16px">开始游戏</div>
    <div class="btn" style="width:92px;padding:11px 0;font-size:14px">玩法说明</div>
    <div class="btn red" style="width:56px;padding:11px 0;font-size:14px">危险</div>
  </div>
  <div class="sub" style="margin-top:6px">按钮一律：3px 黑边 + 4~5px 硬投影，按下时下移</div>

  <div style="font-size:12px;color:#FFD166;font-weight:bold;margin:14px 0 5px">容器 / 槽位</div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="slot" style="width:52px;height:52px">🔥</div>
    <div class="slot" style="width:52px;height:52px;background:#15151c;color:#4a4a58">＋</div>
    <div class="panel" style="padding:8px 10px;font-size:12px;font-weight:bold">面板：3px 黑边 + 8 圆角</div>
  </div>
  <div style="font-size:12px;color:#FFD166;font-weight:bold;margin:14px 0 5px">进度条 / 槽</div>
  <div class="panel" style="height:18px;position:relative;overflow:hidden;border-radius:4px;padding:0">
    <div style="position:absolute;inset:0;background:linear-gradient(#8bd63a,#4f9416)"></div>
    <div class="ol" style="position:relative;text-align:center;font-size:11px;font-weight:bold;line-height:18px">HP</div>
  </div>
  <div class="sub" style="margin-top:10px;font-size:11px">安全边距 8px ｜ 最小热区 44x44 ｜ 屏幕 360x640</div>
</div>
</body></html>
