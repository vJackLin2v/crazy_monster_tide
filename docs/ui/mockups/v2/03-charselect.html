<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>charselect</title><link rel="stylesheet" href="style.css"></head><body>
<!-- ⚠️ 本文件是 **v1.1 的旧版（3 列）**。2026-10-20 起角色选择已按 D-36 改为
     「2 列 × 2 行 + 翻页 + 裁透明边立绘」，权威定义在 docs/ui/ui-spec-approved.md §2.4（v1.2）。
     不要照本文件把实现改回 3 列。 -->
<div class="ph">
  <div class="ttl ol" style="position:absolute;left:0;right:0;top:12px;text-align:center">选择角色</div>
  <div class="sub" style="position:absolute;left:0;right:0;top:46px;text-align:center">每个角色都有正向天赋，也有明显的负面代价</div>
  <div id="chargrid" style="position:absolute;left:12px;right:12px;top:70px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
    <div class="slot" style="height:88px;flex-direction:column;border-color:#f5a623;background:#3a3a4c">
      <img src="../../../../assets/approved/units/swordswoman/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated">
      <div class="ol" style="font-size:11px;color:#f5a623;margin-top:2px">铁拳骑士</div></div>
    <div class="slot" style="height:88px;flex-direction:column"><img src="../../../../assets/approved/units/mage/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated"><div class="ol" style="font-size:11px;margin-top:2px">秘术学徒</div></div>
    <div class="slot" style="height:88px;flex-direction:column"><img src="../../../../assets/approved/units/archer/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated"><div class="ol" style="font-size:11px;margin-top:2px">荒野游侠</div></div>
    <div class="slot" style="height:88px;flex-direction:column"><img src="../../../../assets/approved/units/spearman/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated"><div class="ol" style="font-size:11px;margin-top:2px">苦行僧</div></div>
    <div class="slot" style="height:88px;flex-direction:column"><img src="../../../../assets/approved/units/jester/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated"><div class="ol" style="font-size:11px;margin-top:2px">图腾师</div></div>
    <div class="slot" style="height:88px;flex-direction:column"><img src="../../../../assets/approved/units/rider/idle/01.png" style="width:46px;height:46px;image-rendering:pixelated"><div class="ol" style="font-size:11px;margin-top:2px">狂信者</div></div>
  </div>
  <div class="panel" style="position:absolute;left:12px;right:12px;top:290px;bottom:86px;padding:14px">
    <div class="ol" style="font-size:20px;color:#f5a623">铁拳骑士</div>
    <div style="font-size:13px;font-weight:bold;margin-top:10px" class="ol"><span class="plus">＋</span> 受击后 2s 内攻击力 +20%</div>
    <div style="font-size:13px;font-weight:bold;margin-top:8px" class="ol"><span class="minus">－</span> 移动速度 -10%</div>
    <div class="rowitem" style="margin-top:16px;padding:8px">
      <img src="../../../../assets/approved/icons/skill-fireball.png" style="width:30px;height:30px;image-rendering:pixelated">
      <div class="ol" style="font-size:14px">初始技能：火球</div></div>
    <div class="sub" style="margin-top:14px">攻击 ×1.0　移速 ×0.90　生命 120</div>
  </div>
  <div style="position:absolute;left:12px;right:12px;bottom:16px;display:flex;gap:8px">
    <div class="btn" style="flex:0 0 96px;padding:15px 0;font-size:15px">返回</div>
    <div class="btn pri" style="flex:1;padding:15px 0;font-size:17px">开始闯关</div>
  </div>
</div>
</body></html>
