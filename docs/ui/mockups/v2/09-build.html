<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>build</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ph">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#33333f 0 26px,#2f2f3a 26px 52px)"></div>
  <div class="mask"></div>
  <div class="panel" style="position:absolute;left:0;right:0;bottom:0;height:470px;border-radius:8px 8px 0 0;border-bottom:0">
    <div style="text-align:center;padding:12px 0 8px">
      <div class="ol" style="font-size:19px">构建面板</div>
      <div class="sub" style="font-size:11px;margin-top:3px">第 10 波 · 已暂停</div></div>
    <div style="display:flex;gap:6px;padding:0 12px 10px">
      <div class="chip ol" style="background:#f5a623;color:#2b1d00;border-color:#000;padding:5px 12px;font-size:12px">技能</div>
      <div class="chip ol" style="padding:5px 12px;font-size:12px">模块</div>
      <div class="chip ol" style="padding:5px 12px;font-size:12px">道具</div>
      <div class="chip ol" style="padding:5px 12px;font-size:12px">属性</div>
    </div>
    <div style="padding:0 12px;display:flex;flex-direction:column;gap:7px">
      <div class="rowitem" style="padding:8px 10px">
        <img src="../../../../assets/approved/icons/skill-fireball.png" style="width:32px;height:32px;image-rendering:pixelated">
        <div><div class="ol" style="font-size:13px">1. 火球　Lv.3</div>
          <div class="sub" style="font-size:11px;margin-top:2px">多重 / 穿透　伤害 21　冷却 0.71s</div></div>
        <div style="margin-left:auto;display:flex;gap:4px">
          <div class="slot" style="width:22px;height:22px;font-size:12px">≡</div>
          <div class="slot" style="width:22px;height:22px;font-size:12px">⇢</div>
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
        </div></div>
      <div class="rowitem" style="padding:8px 10px">
        <img src="../../../../assets/approved/icons/skill-ice_spear.png" style="width:32px;height:32px;image-rendering:pixelated">
        <div><div class="ol" style="font-size:13px">2. 冰晶矛　Lv.1</div>
          <div class="sub" style="font-size:11px;margin-top:2px">空　伤害 10　冷却 1.05s</div></div>
        <div style="margin-left:auto;display:flex;gap:4px">
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
        </div></div>
      <div class="rowitem" style="padding:8px 10px">
        <img src="../../../../assets/approved/icons/skill-chain_lightning.png" style="width:32px;height:32px;image-rendering:pixelated">
        <div><div class="ol" style="font-size:13px">3. 连锁闪电　Lv.2</div>
          <div class="sub" style="font-size:11px;margin-top:2px">急速　伤害 14　冷却 1.43s</div></div>
        <div style="margin-left:auto;display:flex;gap:4px">
          <div class="slot" style="width:22px;height:22px;font-size:12px">»</div>
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
          <div class="slot" style="width:22px;height:22px;font-size:13px;background:#15151c;color:#4a4a58">＋</div>
        </div></div>
      <div class="sub" style="text-align:center;margin-top:2px;font-size:11px">点空槽装模块，点已占用的槽可卸下 / 搬家</div>
    </div>
    <div style="position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:8px">
      <div class="btn" style="flex:0 0 112px;padding:14px 0;font-size:14px">主菜单</div>
      <div class="btn pri" style="flex:1;padding:14px 0;font-size:17px">继续</div>
    </div>
  </div>
</div>
</body></html>
