<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">

<div class="ph">
  <div class="ttl ol" style="position:absolute;left:0;right:0;top:14px;text-align:center">玩法说明</div>
  <div class="panel" style="position:absolute;left:12px;right:12px;top:60px;padding:14px;font-size:12px;line-height:1.85">
    <div class="ol" style="color:#f5a623;font-size:14px;margin-bottom:4px">操作</div>

    <div class="ol" style="color:#f5a623;font-size:14px;margin:12px 0 4px">核心构筑</div>
    最多 4 个主动技能，每个技能 3 个行为槽。<br>模块可以重复装，也能在 Build 面板里搬家。
  </div>
  <div class="btn" style="position:absolute;left:12px;right:12px;bottom:16px;padding:15px 0;font-size:17px">返回</div>
