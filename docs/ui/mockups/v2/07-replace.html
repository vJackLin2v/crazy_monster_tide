<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>replace</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ph">
  <div style="position:absolute;inset:0;background:repeating-linear-gradient(45deg,#33333f 0 26px,#2f2f3a 26px 52px)"></div>
  <div class="mask"></div>
  <div class="ttl ol" style="position:absolute;left:0;right:0;top:36px;text-align:center;font-size:19px">技能已满 4 个</div>
  <div class="sub" style="position:absolute;left:0;right:0;top:66px;text-align:center">选择要替换掉的技能</div>
  <div class="panel" style="position:absolute;left:12px;right:12px;top:96px;padding:10px;border-color:#f5a623">
    <div style="display:flex;align-items:center;gap:10px">
      <img src="../../../../assets/approved/icons/skill-frost_ray.png" style="width:40px;height:40px;image-rendering:pixelated">
      <div><div class="ol" style="font-size:16px">霜爆</div>
        <div class="sub" style="font-size:11px;margin-top:2px">冰 · 范围 · 脉冲　伤害 8 ／ 冷却 3.2s</div></div>
      <div class="chip ol" style="margin-left:auto;background:#f5a623;color:#2b1d00;border-color:#000">新</div>
    </div></div>
  <div style="position:absolute;left:12px;right:12px;top:180px;display:flex;flex-direction:column;gap:8px">
    <div class="rowitem" style="padding:9px 10px">
      <img src="../../../../assets/approved/icons/skill-fireball.png" style="width:30px;height:30px;image-rendering:pixelated">
      <div class="ol" style="font-size:14px">火球 <span class="sub" style="font-size:11px">Lv.3 · 已装 2 个模块</span></div>
      <div class="chip ol" style="margin-left:auto;color:#e8452f;border-color:#e8452f">替换</div></div>
    <div class="rowitem" style="padding:9px 10px">
      <img src="../../../../assets/approved/icons/skill-ice_spear.png" style="width:30px;height:30px;image-rendering:pixelated">
      <div class="ol" style="font-size:14px">冰晶矛 <span class="sub" style="font-size:11px">Lv.1 · 无模块</span></div>
      <div class="chip ol" style="margin-left:auto;color:#e8452f;border-color:#e8452f">替换</div></div>
    <div class="rowitem" style="padding:9px 10px">
      <img src="../../../../assets/approved/icons/skill-chain_lightning.png" style="width:30px;height:30px;image-rendering:pixelated">
      <div class="ol" style="font-size:14px">连锁闪电 <span class="sub" style="font-size:11px">Lv.2 · 已装 1 个模块</span></div>
      <div class="chip ol" style="margin-left:auto;color:#e8452f;border-color:#e8452f">替换</div></div>
    <div class="rowitem" style="padding:9px 10px">
      <img src="../../../../assets/approved/icons/skill-arcane_pulse.png" style="width:30px;height:30px;image-rendering:pixelated">
      <div class="ol" style="font-size:14px">圣光弹 <span class="sub" style="font-size:11px">Lv.1 · 无模块</span></div>
      <div class="chip ol" style="margin-left:auto;color:#e8452f;border-color:#e8452f">替换</div></div>
  </div>
  <div class="sub" style="position:absolute;left:12px;right:12px;bottom:72px;text-align:center">被替换技能上的模块会全部退回背包，不会损失</div>
  <div class="btn" style="position:absolute;left:12px;right:12px;bottom:16px;padding:14px 0;font-size:15px">放弃这个技能</div>
</div>
</body></html>
