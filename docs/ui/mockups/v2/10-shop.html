<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<title>shop</title><link rel="stylesheet" href="style.css"></head><body>
<div class="ph">
  <div class="ttl ol" style="position:absolute;left:0;right:0;top:12px;text-align:center">商店</div>
  <div style="position:absolute;left:0;right:0;top:46px;text-align:center">
    <span class="ico" style="display:inline-block;width:17px;height:17px;vertical-align:-3px;background:radial-gradient(circle at 35% 30%,#ffe89a,#d99a1c)"></span>
    <span class="ol" style="font-size:15px;font-weight:bold;margin-left:5px">118</span></div>
  <div style="position:absolute;left:12px;right:12px;top:80px;display:flex;flex-direction:column;gap:7px">
    <div class="rowitem" style="padding:7px 9px;border-color:#e8452f">
      <div class="slot" style="width:36px;height:36px;font-size:18px;border-color:#e8452f">🛡</div>
      <div><div class="ol" style="font-size:14px">铁胸甲</div><div class="sub" style="font-size:11px">减伤 +6%</div></div>
      <div class="chip ol" style="margin-left:auto;color:#f5a623">◆ 26</div>
      <div class="slot btn sm" style="width:30px;height:30px;font-size:13px">🔒</div></div>
    <div class="rowitem" style="padding:7px 9px;border-color:#8bd63a">
      <div class="slot" style="width:36px;height:36px;font-size:18px;border-color:#8bd63a">⛓</div>
      <div><div class="ol" style="font-size:14px">连锁</div><div class="sub" style="font-size:11px">命中后跳向附近目标</div></div>
      <div class="chip ol" style="margin-left:auto;color:#f5a623">◆ 31</div>
      <div class="slot btn sm" style="width:30px;height:30px;font-size:13px">🔓</div></div>
    <div class="rowitem" style="padding:7px 9px;background:#191921;border-color:#2a2a34">
      <div class="slot" style="width:36px;height:36px;font-size:18px;background:#191921;border-color:#2a2a34;color:#4a4a58">⚔</div>
      <div style="opacity:.5"><div class="ol" style="font-size:14px">磨刀石</div><div class="sub" style="font-size:11px">攻击力 +10%</div></div>
      <div class="chip ol" style="margin-left:auto;opacity:.6;border-color:#333">已购</div></div>
    <div class="rowitem" style="padding:7px 9px;border-color:#b9c0cf">
      <div class="slot" style="width:36px;height:36px;font-size:18px;border-color:#b9c0cf">★</div>
      <div><div class="ol" style="font-size:14px">随机属性</div><div class="sub" style="font-size:11px">立刻随机提升 1 项属性</div></div>
      <div class="chip ol" style="margin-left:auto;color:#f5a623">◆ 25</div>
      <div class="slot btn sm" style="width:30px;height:30px;font-size:13px">🔓</div></div>
  </div>
  <div class="sub" style="position:absolute;left:0;right:0;top:352px;text-align:center">下一波：18 秒 · 精英波</div>
  <div class="sub" style="position:absolute;left:12px;right:12px;top:380px;text-align:center;font-size:11px">点货位右侧的锁，刷新时就不会被刷掉（锁住的也能留到下一波）</div>
  <div style="position:absolute;left:12px;right:12px;bottom:16px;display:flex;gap:8px">
    <div class="btn" style="flex:0 0 112px;padding:15px 0;font-size:14px">刷新 ◆2</div>
    <div class="btn pri" style="flex:1;padding:15px 0;font-size:17px">下一波</div>
  </div>
</div>
</body></html>
