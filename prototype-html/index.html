<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>疯狂怪潮 · HTML MVP（Möbelmon 式竖屏单手 UI）</title>
<link rel="stylesheet" href="src/tokens.css">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<div id="stagewrap"><div id="stage">
  <canvas id="cv" width="360" height="640"></canvas>

  <!-- ============ 战斗 ============ -->
  <div class="screen" id="scr-battle">
    <div class="hud">
      <div class="hpwrap"><div class="hpbar" id="hpbar"></div><div class="hptxt" id="hptxt">100/100</div></div>
      <div class="lv" id="lvbox">Lv.1</div>
      <div class="ico" id="btn-pause">II</div>
    </div>
    <div class="expwrap"><div class="expbar" id="expbar"></div></div>
    <div class="goldline"><span>&#9670;</span><span id="goldtxt">0</span>
      <span style="margin-left:auto;color:#8FA3C8" id="wavetxt">第 1 波</span></div>
    <div style="flex:1"></div>
    <div id="skillbar"></div>
  </div>

  <div id="joy"><div class="knob" id="knob"></div></div>
  <div id="joyhint">按住屏幕任意处拖动 = 动态摇杆 &middot; 技能自动开火</div>
  <div class="banner" id="banner"></div>
  <div id="toast"></div>

  <!-- ============ 角色选择 ============ -->
  <div class="screen" id="scr-charselect">
    <div class="ttl">疯狂怪潮</div>
    <div class="sub">4 技能 &middot; 每技能 3 个行为槽 &middot; 行为模块可重复安装</div>
    <div class="charrow" id="charrow"></div>
    <div class="detail" id="chardetail"></div>
    <div class="footer"><button class="btn" id="btn-start" style="width:100%">开始逃命</button></div>
  </div>

  <!-- ============ 地图 ============ -->
  <div class="screen" id="scr-map">
    <div class="hud">
      <div class="hpwrap"><div class="hpbar" id="hpbar2"></div><div class="hptxt" id="hptxt2">100/100</div></div>
      <div class="lv" id="lvbox2">Lv.1</div>
      <div class="ico" id="btn-build">&#9638;</div>
    </div>
    <div class="ttl" style="font-size:var(--ft-n)">选择路线</div>
    <div class="sub" id="mapseedtxt">seed -</div>
    <div class="mapwrap" id="mapwrap"></div>
  </div>

  <!-- ============ 升级 3 选 1 ============ -->
  <div class="screen" id="scr-levelup">
    <div class="ttl">升级！</div>
    <div class="sub" id="luSub">从下列 3 项中选择 1 项</div>
    <div class="cards" id="lucards"></div>
    <div class="footer"><button class="btn ghost" id="btn-skip" style="width:100%;font-size:var(--ft-s)">跳过（+8 金币）</button></div>
  </div>

  <!-- ============ 模块安装目标 ============ -->
  <div class="screen" id="scr-install">
    <div class="ttl" style="font-size:var(--ft-n)" id="instTitle">安装到哪个技能？</div>
    <div class="sub" id="instSub">仅显示兼容槽位</div>
    <div class="scroll" id="instlist"></div>
    <div class="footer"><button class="btn ghost" id="btn-instback" style="width:100%;font-size:var(--ft-s)">返回</button></div>
  </div>

  <!-- ============ Build 面板 ============ -->
  <div class="screen" id="scr-build">
    <div class="ttl" style="font-size:var(--ft-n)">构建面板</div>
    <div class="tabs" id="btabs"></div>
    <div class="scroll" id="blist"></div>
    <div class="footer"><button class="btn" id="btn-resume" style="width:100%">继续</button></div>
  </div>

  <!-- ============ 商店 ============ -->
  <div class="screen" id="scr-shop">
    <div class="ttl" style="font-size:var(--ft-n)">杂货铺</div>
    <div class="sub" id="shopGold">金币 0</div>
    <div class="scroll" id="shoplist"></div>
    <div class="footer"><button class="btn" id="btn-shopleave" style="width:100%">离开</button></div>
  </div>

  <!-- ============ 事件 ============ -->
  <div class="screen" id="scr-event">
    <div class="ttl" style="font-size:var(--ft-n)">事件</div>
    <div class="scroll">
      <div class="panel" style="padding:12px;font-size:var(--ft-s);line-height:1.6" id="evtext"></div>
      <div id="evopts" style="margin-top:10px"></div>
    </div>
    <div class="footer"></div>
  </div>

  <!-- ============ 结算 ============ -->
  <div class="screen" id="scr-result">
    <div class="ttl" id="resTitle">结算</div>
    <div class="scroll">
      <div class="bigsale" id="resBig">通关</div>
      <div class="panel" style="padding:10px;margin-top:10px" id="resStats"></div>
      <h3 style="font-size:var(--ft-s);color:var(--accent);margin:12px 0 4px">本局 Build</h3>
      <div id="resBuild"></div>
    </div>
    <div class="footer"><button class="btn" id="btn-again" style="width:100%">再来一局</button></div>
  </div>

</div></div>

<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/flow.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
</body>
</html>
